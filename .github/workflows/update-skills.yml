name: Update skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Update sources
        run: |
          jq -c '.[]' sources.json | while read -r item; do
            package="$(jq -r '.package' <<< "$item")"
            args=()

            while read -r skill; do
              args+=(--skill "$skill")
            done < <(jq -r '.skill[]' <<< "$item")

            echo "Updating $package"

            npx -y skills add "$package" "${args[@]}" --agent opencode --copy -y

            while read -r skill; do
              rm -rf "skills/$skill"
              mkdir -p skills
              cp -a ".agents/skills/$skill" "skills/$skill"
              rm -rf ".agents/skills/$skill"

              git add -A "skills/$skill"

              if git diff --cached --quiet -- "skills/$skill"; then
                echo "No changes for $skill"
              else
                git commit -m "update $skill"
              fi
            done < <(jq -r '.skill[]' <<< "$item")
          done

      - name: Push changes
        run: git push
