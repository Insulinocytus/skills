name: Update skills

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - sources.json
      - .github/workflows/update-skills.yml
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Update sources
        run: |
          mapfile -t sources < <(jq -c '.[]' sources.json)

          for item in "${sources[@]}"; do
            repository="$(jq -r '.repository' <<< "$item")"
            args=()
            mapfile -t skills < <(jq -r '.skill[]' <<< "$item")

            for skill in "${skills[@]}"; do
              args+=(--skill "$skill")
            done

            echo "Updating $repository"

            npx -y skills add "$repository" "${args[@]}" --agent opencode --copy -y </dev/null

            if [ ! -d .agents/skills ]; then
              echo "No installed skills found for $repository"
              continue
            fi

            mapfile -t installed_skills < <(find .agents/skills -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)

            if [ "${#installed_skills[@]}" -eq 0 ]; then
              echo "No installed skills found for $repository"
              continue
            fi

            for skill in "${installed_skills[@]}"; do
              rm -rf "skills/$skill"
              mkdir -p skills
              cp -a ".agents/skills/$skill" "skills/$skill"
              rm -rf ".agents/skills/$skill"

              git add -A "skills/$skill"

              if git diff --cached --quiet -- "skills/$skill"; then
                echo "No changes for $skill"
              else
                git commit -m "update $skill"
              fi
            done
          done

      - name: Push changes
        run: git push
